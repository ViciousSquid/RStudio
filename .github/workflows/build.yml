name: Nuitka Build and Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard  # zstandard enables onefile compression

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --plugin-enable=pyqt5 `
            --plugin-enable=numpy `
            --plugin-enable=anti-bloat `
            --include-package=engine `
            --include-package=editor `
            --include-package=PIL `
            --include-data-dir=assets=assets `
            --include-data-dir=maps=maps `
            --include-data-files=settings.ini=settings.ini `
            --windows-icon-from-ico=assets/icon.ico `
            --windows-console-mode=disable `
            --output-dir=build `
            main.py

      - name: Build with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --plugin-enable=pyqt5 \
            --plugin-enable=numpy \
            --plugin-enable=anti-bloat \
            --include-package=engine \
            --include-package=editor \
            --include-package=PIL \
            --include-data-dir=assets=assets \
            --include-data-dir=maps=maps \
            --include-data-files=settings.ini=settings.ini \
            --macos-app-icon=assets/icon.ico \
            --output-dir=build \
            main.py

      - name: Validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "build/main.exe"
          if (Test-Path $exePath) {
            Write-Host "✅ Executable found: $exePath"
            # Attempt to run the executable and kill it after 5 seconds
            # This catches immediate crashes (e.g., missing DLLs or import errors)
            $proc = Start-Process -FilePath $exePath -PassThru
            Start-Sleep -Seconds 5
            if ($proc.HasExited) {
              if ($proc.ExitCode -ne 0) { 
                Write-Error "❌ Application crashed on startup with exit code $($proc.ExitCode)"
                exit 1
              }
            } else {
              Stop-Process -Id $proc.Id
              Write-Host "✅ Validation successful: Application started without immediate crash."
            }
          } else {
            Write-Error "❌ Build failed: Executable not found at $exePath"
            exit 1
          }

      - name: Validation (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "build/main.app" ]; then
            echo "✅ App bundle found: build/main.app"
            # Verify the internal binary exists within the bundle
            if [ -f "build/main.app/Contents/MacOS/main" ]; then
               echo "✅ Internal binary verified."
            else
               echo "❌ Internal binary missing from bundle!"
               exit 1
            fi
          else
            echo "❌ Build failed: App bundle not found."
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: |
            build/*.exe
            build/*.app
