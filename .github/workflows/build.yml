name: Nuitka Build and Validate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - "1.2.4.0_Latest"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --output-filename=Fio `
            --assume-yes-for-downloads `
            --plugin-enable=pyqt5 `
            --include-package=engine `
            --include-package=editor `
            --include-package=PIL `
            --include-data-dir=assets=assets `
            --include-data-dir=tools=tools `
            --include-data-dir=maps=maps `
            --include-data-files=settings.ini=settings.ini `
            --include-data-files=editor/version.txt=editor/version.txt `
            --windows-icon-from-ico=assets/icon.ico `
            --windows-console-mode=disable `
            --output-dir=build `
            main.py

      - name: Validate executable exists
        shell: pwsh
        run: |
          if (Test-Path "build/main.dist/Fio.exe") {
            Write-Host "Build successful - Fio.exe found"
          } else {
            Write-Error "Build failed: Fio.exe not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fio-windows
          path: build/main.dist/


  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard imageio pillow

      - name: Convert icon to .icns
        run: |
          mkdir -p build/icon.iconset
          sips -s format png assets/icon.ico --out build/icon.png

          for size in 16 32 64 128 256 512; do
            sips -z $size $size build/icon.png --out build/icon.iconset/icon_${size}x${size}.png
            sips -z $(($size*2)) $(($size*2)) build/icon.png --out build/icon.iconset/icon_${size}x${size}@2x.png
          done

          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build with Nuitka (App Bundle)
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name=Fio \
            --output-filename=Fio \
            --assume-yes-for-downloads \
            --plugin-enable=pyqt5 \
            --include-package=engine \
            --include-package=editor \
            --include-package=PIL \
            --include-data-dir=assets=assets \
            --include-data-dir=tools=tools \
            --include-data-dir=maps=maps \
            --include-data-files=settings.ini=settings.ini \
            --include-data-files=editor/version.txt=editor/version.txt \
            --macos-app-icon=build/icon.icns \
            --output-dir=build \
            main.py

      - name: Validate app bundle
        run: |
          if [ -f "build/main.app/Contents/MacOS/Fio" ]; then
            echo "App bundle OK"
          else
            echo "App bundle broken"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fio-macos
          path: build/main.app/


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libdbus-1-3 libxcb-xinerama0 libxcb-cursor0 libglib2.0-0 patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --output-filename=Fio \
            --assume-yes-for-downloads \
            --plugin-enable=pyqt5 \
            --include-package=engine \
            --include-package=editor \
            --include-package=PIL \
            --include-data-dir=assets=assets \
            --include-data-dir=tools=tools \
            --include-data-dir=maps=maps \
            --include-data-files=settings.ini=settings.ini \
            --include-data-files=editor/version.txt=editor/version.txt \
            --output-dir=build \
            main.py

      - name: Validate executable exists
        run: |
          if [ -f "build/main.dist/Fio" ]; then
            echo "Build successful - Fio found"
          else
            echo "Build failed: executable not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fio-linux
          path: build/main.dist/
