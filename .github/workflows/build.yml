name: Nuitka Build and Validate

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      branch_name: ${{ steps: vars.outputs.branch }}

    steps:
      - uses: actions/checkout@v4

      # Extract and sanitize the branch name for file renaming
      - name: Set branch name variable
        id: vars
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $sanitized = $branch -replace '[/\\?%*:|"<>]', '_'
          echo "branch=$sanitized" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --output-filename=Fio `
            --assume-yes-for-downloads `
            --plugin-enable=pyqt5 `
            --include-qt-plugins=sensible,platforms,styles,imageformats `
            --include-package=engine `
            --include-package=editor `
            --include-package=PIL `
            --include-data-dir=assets=assets `
            --include-data-dir=tools=tools `
            --include-data-dir=maps=maps `
            --include-data-files=settings.ini=settings.ini `
            --include-data-files=editor/version.txt=editor/version.txt `
            --windows-icon-from-ico=assets/icon.ico `
            --windows-console-mode=disable `
            --output-dir=build `
            main.py

      - name: Validate executable exists
        shell: pwsh
        run: |
          if (Test-Path "build/main.dist/Fio.exe") {
            Write-Host "Build successful - Fio.exe found"
          } else {
            Write-Error "Build failed: Fio.exe not found"
            exit 1
          }

      - name: Package Windows distribution
        shell: pwsh
        run: |
          # Compress the directory to a zip named after the branch
          Compress-Archive -Path build/main.dist/* -DestinationPath "build/Fio-${{ steps.vars.outputs.branch }}_Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: fio-windows
          path: build/Fio-${{ steps.vars.outputs.branch }}_Windows.zip


  build-macos:
    runs-on: macos-latest
    outputs:
      branch_name: ${{ steps.vars.outputs.branch }}

    steps:
      - uses: actions/checkout@v4

      - name: Set branch name variable
        id: vars
        run: |
          BRANCH="${{ github.ref_name }}"
          SANITIZED=$(echo "$BRANCH" | sed 's/[/\?%*:|"<>]/_/g')
          echo "branch=$SANITIZED" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard imageio

      - name: Convert icon to .icns
        run: |
          mkdir -p build/icon.iconset
          sips -s format png assets/icon.ico --out build/icon.png

          for size in 16 32 64 128 256 512; do
            sips -z $size $size build/icon.png --out build/icon.iconset/icon_${size}x${size}.png
            sips -z $(($size*2)) $(($size*2)) build/icon.png --out build/icon.iconset/icon_${size}x${size}@2x.png
          done

          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build with Nuitka (App Bundle)
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name=Fio \
            --output-filename=Fio \
            --assume-yes-for-downloads \
            --plugin-enable=pyqt5 \
            --include-qt-plugins=sensible,platforms,imageformats \
            --include-package=engine \
            --include-package=editor \
            --include-package=PIL \
            --include-data-dir=assets=assets \
            --include-data-dir=tools=tools \
            --include-data-dir=maps=maps \
            --include-data-files=settings.ini=settings.ini \
            --include-data-files=editor/version.txt=editor/version.txt \
            --macos-app-icon=build/icon.icns \
            --macos-disable-console \
            --output-dir=build \
            main.py

      - name: Validate app bundle
        run: |
          if [ -f "build/main.app/Contents/MacOS/Fio" ]; then
            echo "App bundle OK"
          else
            echo "App bundle broken"
            exit 1
          fi

      - name: Prepare app bundle for distribution
        run: |
          mkdir -p build/main.app/Contents/Resources
          cat > build/main.app/Contents/Resources/qt.conf << 'EOF'
          [Paths]
          Plugins = ../MacOS/PyQt5/Qt5/plugins
          EOF

          cd build
          mv main.app Fio.app
          zip -r -y "Fio-${{ steps.vars.outputs.branch }}_macOS.zip" Fio.app

      - uses: actions/upload-artifact@v4
        with:
          name: fio-macos
          path: build/Fio-${{ steps.vars.outputs.branch }}_macOS.zip


  build-linux:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.vars.outputs.branch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-xinerama0 libxcb-cursor0 libglib2.0-0 patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Set branch name variable
        id: vars
        run: |
          BRANCH="${{ github.ref_name }}"
          SANITIZED=$(echo "$BRANCH" | sed 's/[/\?%*:|"<>]/_/g')
          echo "branch=$SANITIZED" >> $GITHUB_OUTPUT

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --output-filename=Fio \
            --assume-yes-for-downloads \
            --plugin-enable=pyqt5 \
            --include-qt-plugins=sensible,platforms,imageformats \
            --include-package=engine \
            --include-package=editor \
            --include-package=PIL \
            --include-data-dir=assets=assets \
            --include-data-dir=tools=tools \
            --include-data-dir=maps=maps \
            --include-data-files=settings.ini=settings.ini \
            --include-data-files=editor/version.txt=editor/version.txt \
            --output-dir=build \
            main.py

      - name: Validate executable exists
        run: |
          if [ -f "build/main.dist/Fio" ]; then
            echo "Build successful - Fio found"
          else
            echo "Build failed: executable not found"
            exit 1
          fi

      - name: Package Linux distribution
        run: |
          cd build/main.dist
          zip -r "../Fio-${{ steps.vars.outputs.branch }}_Linux.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: fio-linux
          path: build/Fio-${{ steps.vars.outputs.branch }}_Linux.zip


  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten directory structure so files can be uploaded directly
      - name: Prepare assets
        run: |
          mkdir release_assets
          find artifacts -type f -name "*.zip" -exec cp {} release_assets/ \;
          ls -l release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.branch_name }}
          name: Release ${{ needs.build-windows.outputs.branch_name }}
          draft: false
          prerelease: false
          files: release_assets/*.zip
