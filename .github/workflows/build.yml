name: Nuitka Build and Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # imageio is required for macOS icon conversion
          # zstandard is required for onefile compression
          pip install nuitka zstandard imageio 

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --assume-yes-for-downloads `
            --plugin-enable=pyqt5 `
            --include-package=engine `
            --include-package=editor `
            --include-package=PIL `
            --include-data-dir=assets=assets `
            --include-data-dir=maps=maps `
            --include-data-files=settings.ini=settings.ini `
            --windows-icon-from-ico=assets/icon.ico `
            --windows-console-mode=disable `
            --output-dir=build `
            main.py

      - name: Build with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --assume-yes-for-downloads \
            --plugin-enable=pyqt5 \
            --include-package=engine \
            --include-package=editor \
            --include-package=PIL \
            --include-data-dir=assets=assets \
            --include-data-dir=maps=maps \
            --include-data-files=settings.ini=settings.ini \
            --macos-app-icon=assets/icon.ico \
            --output-dir=build \
            main.py

      - name: Validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "build/main.exe") {
            Write-Host "✅ Executable found."
          } else {
            Write-Error "❌ Build failed: Executable not found."
            exit 1
          }

      - name: Validation (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "build/main.app" ]; then
            echo "✅ App bundle found."
          else
            echo "❌ Build failed: App bundle not found."
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: |
            build/*.exe
            build/*.app
