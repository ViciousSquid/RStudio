# Builds a debug APK of the standalone Fio Player with buildozer
# (python-for-android) and uploads it as a downloadable artifact.
#
# Trigger it from the GitHub UI: Actions -> "Android Player Build" -> Run
# workflow. It also runs automatically when files under player/ change.

name: Android Player Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'player/**'
      - 'engine/**'
      - 'main.py'
      - '.github/workflows/android-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache

      - name: Install Buildozer and python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            "cython==0.29.36" \
            "buildozer==1.5.0" \
            "python-for-android==2024.01.21"

      - name: Show tool versions
        run: |
          python --version
          pip --version
          buildozer --version
          python -c "import pythonforandroid; print('python-for-android:', pythonforandroid.__version__)"

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ runner.os }}-${{ hashFiles('player/buildozer.spec') }}
          restore-keys: |
            buildozer-global-v2-${{ runner.os }}-

      - name: Cache buildozer local dir
        uses: actions/cache@v4
        with:
          path: player/.buildozer
          key: buildozer-local-v2-${{ runner.os }}-${{ hashFiles('player/buildozer.spec') }}
          restore-keys: |
            buildozer-local-v2-${{ runner.os }}-

      - name: Bundle sample game package
        run: |
          python -m player.tools.make_pak \
            maps/Simple_Map_Test.json \
            -o player/game.fiopak \
            --root . \
            --title "Fio Player Test"

      - name: Build debug APK
        working-directory: player
        run: |
          yes | buildozer android debug

      - name: Locate APK
        id: apk
        run: |
          APK=$(find player/bin -name "*.apk" | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fio-player-debug-apk
          path: player/bin/*.apk
          if-no-files-found: error
